<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hear You | Classroom access</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; color: #203638; background: #f4f8f6; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        main { width: min(680px, 100%); background: white; border: 1px solid #dce8e3; border-radius: 16px; padding: 42px; }
        .brand { color: #18766e; font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        h1 { margin: 18px 0 12px; font-size: clamp(32px, 6vw, 48px); line-height: 1.08; }
        p { color: #526768; font-size: 17px; line-height: 1.6; }
        a { display: inline-block; margin-top: 18px; padding: 13px 20px; border-radius: 8px; background: #18766e; color: white; text-decoration: none; font-weight: 700; }
        a:hover { background: #105e57; }
        a:focus-visible { outline: 3px solid #e2a548; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <div class="brand">Hear You · Classroom access</div>
        <h1>Follow the lecture at your own pace.</h1>
        <p>Read live captions, raise your hand when you need to, or send a question in writing. This simple classroom view is a test of the project’s backend features.</p>
        <a href="{{ url_for('classroom') }}">Open the classroom</a>
    </main>
</body>
</html>
