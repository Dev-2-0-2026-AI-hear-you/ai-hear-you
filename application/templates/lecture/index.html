{% extends 'base.html' %}

{% block header %}
    <h1>{% block title %}Main Page{% endblock %}</h1>
    {% if g.user %}
        <a class="action" href="{{ url_for('lecture.ask') }}">Ask Question</a>
    {% endif %}
{% endblock %}

{% block content %}

    {% for question in questions %}
        <article class="question">
            <header>
                <div>
                    <p class="body">{{ question['body'] }}</p>
                    <div class="about"><by {{ post['username'] }} on {{ post['created'].strftime('%Y-%m-%d') }}</div>
                </div>
            </header>
        </article>
        {% if not loop.last %}
            <hr>
        {% endif %}
    {% endfor %}
{% endblock %}
